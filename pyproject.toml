[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wifisurvey"
version = "1.0.0"
description = "Analise de varredura de Wi-Fi por andar: mapa de calor de RSSI, dimensionamento de access points e conflito de canal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "wifi",
    "wlan",
    "802-11",
    "site-survey",
    "heatmap",
    "rssi",
    "canais",
    "rf",
    "infraestrutura",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
# Zero dependencia de runtime, e o ponto do projeto. O mapa de calor sai em
# PNG escrito com zlib e struct, da biblioteca padrao; a perda de caminho e
# matematica; o CSV e csv da biblioteca padrao. A unica dependencia externa e
# PyYAML, para ler os parametros de projeto - e o projeto roda sem ela,
# usando os valores embutidos em capacidade.py.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
wifisurvey = "wifisurvey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["wifisurvey"]

[tool.coverage.report]
show_missing = true
# O padrao do portfolio e 70%. O projeto real esta em 96%; o piso fica aqui
# para que uma regressao derrube o build em vez de passar despercebida.
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "if TYPE_CHECKING:",
]
